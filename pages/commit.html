<!-- Scripts -->
<script src='../tame.js'></script>
<script>(async () => {
  // Load modules
  const {
    global,
  } = await t.requireModulesAsync({
    global: 'global',
  });

  const {
    root,
    refs: {
      type,
      scope,
      message,
      motivation,
      explanation,
      submit,
      output,
      reset,
    },
  } = t.createComponent(`
    <div class='app-container'>
      <select data-ref='type'>
        <option value='feat'>Feature (Add/Adjust/Remove)</option>
        <option value='fix'>Fix</option>
        <option value='refactor'>Refactor</option>
        <option value='perf'>Performance (Refactor)</option>
        <option value='style'>Code Style</option>
        <option value='test'>Tests (Add or Fix)</option>
        <option value='docs'>Docs</option>
        <option value='build'>Build Configuration</option>
        <option value='chore'>Chore (git maintenance)</option>
        <option value='part'>Partial Commit</option>
      </select>
      <input data-ref='scope' placeholder='Scope'/>
      <input data-ref='message' placeholder='Applying this commit will...'/>
      <textarea data-ref='motivation' placeholder='What motivated this commit?'></textarea>
      <textarea data-ref='explanation' placeholder='Why did you choose this solution?'></textarea>
      <button data-ref='submit'>Generate</button>
      <p data-ref='output' class='output hide'></p>
      <button data-ref='reset' class='hide'>Reset</button>
    </div>
  `);
  document.body.appendChild(root);
  scope.focus();

  submit.onclick = () => {
    output.innerText = `${scope.value}: [${type.value}] ${message.value}

What motivated this commit?
${motivation.value}${explanation.value === '' ? '' : `

Why was this solution chosen?
${explanation.value}`}`;

    output.classList.remove('hide');
    reset.classList.remove('hide');
    reset.focus();
    selectText(output);
  };

  reset.onclick = () => {
    type.value = 'feat';
    message.value = '';
    motivation.value = '';
    explanation.value = '';
    output.classList.add('hide');
    reset.classList.add('hide');
    scope.focus();
  };

  function selectText(node) {
    if (document.body.createTextRange) {
      const range = document.body.createTextRange();
      range.moveToElementText(node);
      range.select();
    } else if (window.getSelection) {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(node);
      selection.removeAllRanges();
      selection.addRange(range);
    } else {
      console.warn("Could not select text in node: Unsupported browser.");
    }
  }
  
})();</script>
