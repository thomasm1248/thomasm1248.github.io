<div id='app'></div>

<script src='../tame.js'></script>
<script>

  const {
    root: ui,
    refs: {
      log,
      panel,
      countdown,
      instructions,
      startPanel,
      task,
      start,
      runningPanel,
      preReport,
      restart,
      abort,
      reportPanel,
      report,
      finishReport,
    },
  } = t.createComponent(`
    <div class='focus-timer-container'>
      <div data-ref='log' class='log'></div>
      <div data-ref='panel' class='panel'>
        <p data-ref='countdown' class='countdown'>0:00</p>
        <p data-ref='instructions' class='instructions'></p>
        <div data-ref='startPanel'>
          <input data-ref='task' placeholder='What will you do?'></input><br>
          <button data-ref='start'>Start</button>
        </div>
        <div data-ref='runningPanel' class='hidden'>
          <textarea data-ref='preReport' placeholder='Track what you're doing...'
                    cols='40' rows='15'>
          </textarea><br>
          <button data-ref='restart'>Restart</button>
          <button data-ref='abort'>Abort</button>
        </div>
        <div data-ref='reportPanel' class='hidden'>
          <textarea data-ref='report' placeholder='What happened?'
                    cols='40' rows='15'>
          </textarea><br>
          <button data-ref='finishReport'>Submit</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('app').appendChild(ui);

  // Bind UI
  start.onclick = _ => {
    if(currentState.start)
      currentState.start();
  };
  task.onkeydown = e => {
    if(e.key !== 'Enter') return;
    if(currentState.start)
      currentState.start();
    e.preventDefault();
  };
  restart.onclick = _ => {
    if(currentState.restart)
      currentState.restart();
  };
  abort.onclick = _ => {
    if(currentState.abort)
      currentState.abort();
  };
  finishReport.onclick = _ => {
    if(currentState.finish)
      currentState.finish();
  };
  report.onkeydown = e => {
    if(e.key !== 'Enter') return;
    if(e.shiftKey) return;
    if(currentState.finish)
      currentState.finish();
    e.preventDefault();
  };

  let currentState = null;

  async function init() {
    const beep = await t.requireAsync('js/utils/beep');

    function startState() {
      t.log('start state');
      document.title = 'Focus Timer';
      task.value = '';
      startPanel.classList.remove('hidden');
      task.focus();
      return {
        start: () => {
          startPanel.classList.add('hidden');
          currentState = runningState(task.value);
        },
      };
    }

    function runningState(task) {
      t.log('running state');
      const time = 25 * 60 * 1000;
      let endTime = Date.now() + time;
      function displayTime() {
        const now = Date.now();
        if(now >= endTime) {
          beep.playBeep();
          runningPanel.classList.add('hidden');
          countdown.innerText = '0:00';
          currentState = reportingState();
          return;
        }
        const remainingSeconds = Math.floor((endTime - now) / 1000);
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        let secondsText = '' + seconds;
        if(secondsText.length < 2)
          secondsText = '0' + secondsText;
        const text = `${minutes}:${secondsText}`;
        countdown.innerText = text;
        document.title = text;
      }
      displayTime();
      instructions.innerText = task;
      preReport.value = '';
      runningPanel.classList.remove('hidden');
      preReport.focus();
      return {
        tick: displayTime,
        restart: () => {
          endTime = Date.now() + time;
          displayTime();
        },
        abort: () => {
          runningPanel.classList.add('hidden');
          countdown.innerText = '0:00';
          instructions.innerText = '';
          currentState = startState();
        },
      };
    }

    function reportingState() {
      t.log('reporting state');
      report.value = preReport.value;
      reportPanel.classList.remove('hidden');
      report.focus();
      return {
        finish: () => {
          const task = instructions.innerText;
          const reportText = report.value;
          const { root: logEntry } = t.createComponent(`
            <div>
              <p class='task-name'>${t.escapeHTML(task)}</p>
              <p class='task-report'>${t.escapeHTML(reportText)}</p>
            </div>
          `);
          log.appendChild(logEntry);
          instructions.innerText = '';
          reportPanel.classList.add('hidden');
          currentState = startState();
        },
      };
    }

    function startItem(index) {
      currentScheduleIndex = index;
      endTime = Date.now() + schedule[index].minutes * 60 * 1000;
    }

    currentState = startState();

    setInterval(() => {
      if(currentState.tick)
        currentState.tick();
    }, 1000);
  }

  init();

</script>

  width: 100%;

  display: flex;
}

  width: 300px;
  flex: 0 0 1;

  flex: 1 1 0;

  font-size: 5em;

}

}

  padding: 5px;

  display: block;

}
